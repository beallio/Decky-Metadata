name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - dev
      - main

jobs:
  quality-gates:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'test-build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        # setup-uv publishes only full-version tags, so pin the current release.
        # v10 runs on Node 24; explicit caching preserves this workflow's policy.
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install pinned Rust and musl target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-unknown-linux-musl

      - name: Install frontend dependencies
        run: ./run.sh npm ci

      - name: Type-check frontend
        run: ./run.sh npx tsc --noEmit

      - name: Build frontend
        run: ./run.sh npm run build

      - name: Verify committed bundle
        run: git diff --exit-code dist/index.js

      - name: Test frontend
        run: ./run.sh npm test

      - name: Test Rust backend
        run: ./run.sh npm run test:backend

      - name: Build locked static Rust backend
        env:
          DECKY_SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
        run: ./run.sh npm run build:backend

      - name: Build host diagnostics binary
        run: ./run.sh cargo build --locked --manifest-path backend-rust/Cargo.toml --bin backend-diagnostics

      - name: Test native packaging behavior
        run: ./run.sh node --test tests/package_mjs_test.mjs

      - name: Compile upstream shim
        run: ./run.sh python3 -m py_compile main.py

      - name: Test Python tooling
        run: ./run.sh uv run --with pytest -- pytest -q

      - name: Check release version drift
        run: ./run.sh python3 scripts/version_guard.py check-drift "$(node -p "require('./package.json').version")"

      # Fork build publication is authorized in publish-pr-build.yml.
      - name: Package PR testing artifact
        if: >-
          github.event_name == 'pull_request' &&
          (
            github.event.pull_request.head.repo.full_name == github.repository ||
            contains(github.event.pull_request.labels.*.name, 'test-build')
          )
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DECKY_PACKAGE_DIR: ${{ runner.temp }}/pr-package
          DECKY_SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          short_sha="${PR_HEAD_SHA::7}"
          pr_version="${base}-dev.pr${PR_NUMBER}.g${short_sha}"
          ./run.sh node scripts/package.mjs --release \
            --release-version "$pr_version" \
            --release-tag "v$pr_version" \
            --channel dev \
            --emit-release-metadata
          cp "$DECKY_PACKAGE_DIR/Decky-Metadata-v${pr_version}.zip.sha256" "$DECKY_PACKAGE_DIR/Decky-Metadata.zip.sha256"
          python3 - "$DECKY_PACKAGE_DIR/Decky-Metadata-v${pr_version}.manifest.json" "$DECKY_PACKAGE_DIR/Decky-Metadata.manifest.json" "$PR_NUMBER" "$PR_HEAD_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          src, dst, pr_number, head_sha = sys.argv[1:5]
          manifest = json.loads(Path(src).read_text(encoding="utf-8"))
          manifest["prNumber"] = int(pr_number)
          manifest["headSha"] = head_sha.lower()
          Path(dst).write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          (cd "$DECKY_PACKAGE_DIR" && sha256sum -c Decky-Metadata.zip.sha256)

      - name: Upload PR testing artifact
        if: >-
          github.event_name == 'pull_request' &&
          (
            github.event.pull_request.head.repo.full_name == github.repository ||
            contains(github.event.pull_request.labels.*.name, 'test-build')
          )
        uses: actions/upload-artifact@v7
        with:
          name: decky-metadata-pr
          path: |
            ${{ runner.temp }}/pr-package/Decky-Metadata.zip
            ${{ runner.temp }}/pr-package/Decky-Metadata.zip.sha256
            ${{ runner.temp }}/pr-package/Decky-Metadata.manifest.json
          if-no-files-found: error
