name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        # setup-uv publishes only full-version tags, so pin the current release.
        # v10 runs on Node 24; explicit caching preserves this workflow's policy.
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install pinned Rust and musl target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-unknown-linux-musl

      - name: Install frontend dependencies
        run: ./run.sh npm ci

      - name: Type-check frontend
        run: ./run.sh npx tsc --noEmit

      - name: Build frontend
        run: ./run.sh npm run build

      - name: Verify committed bundle
        run: git diff --exit-code dist/index.js

      - name: Test frontend
        run: ./run.sh npm test

      - name: Test Rust backend
        run: ./run.sh npm run test:backend

      - name: Build locked static Rust backend
        run: ./run.sh npm run build:backend

      - name: Build host diagnostics binary
        run: ./run.sh cargo build --locked --manifest-path backend-rust/Cargo.toml --bin backend-diagnostics

      - name: Test native packaging behavior
        run: ./run.sh node --test tests/package_mjs_test.mjs

      - name: Compile upstream shim
        run: ./run.sh python3 -m py_compile main.py

      - name: Test Python tooling
        run: ./run.sh uv run --with pytest -- pytest -q

      - name: Check release version drift
        run: ./run.sh python3 scripts/version_guard.py check-drift "$(node -p "require('./package.json').version")"
