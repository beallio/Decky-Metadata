# Publishes verified PR builds without exposing write permissions to untrusted
# pull_request workflows. Fork PR builds require explicit maintainer dispatch.
name: Publish PR Build

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open fork PR number to publish"
        required: true
        type: string
      head_sha:
        description: "Exact PR head SHA to publish"
        required: true
        type: string

concurrency:
  group: pr-builds-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Download and publish verified PR build asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          DISPATCH_HEAD_SHA: ${{ github.event.inputs.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          ARTIFACT_DIR: ${{ runner.temp }}/pr-artifact
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$DISPATCH_PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Invalid PR number: $DISPATCH_PR_NUMBER" >&2
              exit 1
            fi
            if [[ ! "$DISPATCH_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Invalid head SHA: $DISPATCH_HEAD_SHA" >&2
              exit 1
            fi
            DISPATCH_HEAD_SHA="${DISPATCH_HEAD_SHA,,}"
            pr_number="$DISPATCH_PR_NUMBER"
            dispatch_pr_json="$RUNNER_TEMP/dispatch-pr.json"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "$dispatch_pr_json"
            python3 - "$dispatch_pr_json" "$GITHUB_REPOSITORY" "$DISPATCH_HEAD_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          pr = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          repo, expected_sha = sys.argv[2].lower(), sys.argv[3].lower()
          head = pr.get("head") or {}
          head_repo = head.get("repo") or {}
          labels = {str(item.get("name", "")).lower() for item in pr.get("labels") or []}
          if pr.get("state") != "open":
              raise SystemExit("PR is not open")
          if not head_repo.get("fork"):
              raise SystemExit("PR is not from a fork")
          if str(head.get("sha", "")).lower() != expected_sha:
              raise SystemExit("PR head SHA does not match the requested SHA")
          if "test-build" not in labels:
              raise SystemExit("PR is missing the test-build label")
          PY
            run_query="[.workflow_runs[] | select(.head_sha == \"$DISPATCH_HEAD_SHA\" and .event == \"pull_request\" and .conclusion == \"success\")] | .[0].id // empty"
            RUN_ID="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$DISPATCH_HEAD_SHA" -f event=pull_request -f status=completed -f per_page=100 \
              --jq "$run_query")"
            if [[ -z "$RUN_ID" ]]; then
              echo "No successful CI pull_request run exists for $DISPATCH_HEAD_SHA" >&2
              exit 1
            fi
          else
            if [[ "${WORKFLOW_RUN_HEAD_REPO,,}" != "${GITHUB_REPOSITORY,,}" ]]; then
              echo "Fork PR workflow_run cannot publish; a maintainer must dispatch the exact head SHA."
              exit 0
            fi
            RUN_ID="$WORKFLOW_RUN_ID"
          fi

          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid run_id: $RUN_ID" >&2
            exit 1
          fi
          run_json="$RUNNER_TEMP/ci-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > "$run_json"
          run_head_sha="$(python3 - "$run_json" "$EVENT_NAME" "$DISPATCH_HEAD_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          event_name, requested_sha = sys.argv[2], sys.argv[3].lower()
          if run.get("event") != "pull_request" or run.get("conclusion") != "success":
              raise SystemExit("Selected run is not a successful pull_request CI run")
          head_sha = str(run.get("head_sha", "")).lower()
          if event_name == "workflow_dispatch" and head_sha != requested_sha:
              raise SystemExit("Selected CI run head SHA does not match the requested SHA")
          print(head_sha)
          PY
          )"

          mkdir -p "$ARTIFACT_DIR"
          if ! gh run download "$RUN_ID" --name decky-metadata-pr --dir "$ARTIFACT_DIR"; then
            echo "Run $RUN_ID has no decky-metadata-pr artifact; nothing to publish."
            exit 0
          fi

          cd "$ARTIFACT_DIR"
          sha256sum -c Decky-Metadata.zip.sha256

          pr_number="$(python3 - Decky-Metadata.manifest.json <<'PY'
          import json, re, sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if isinstance(manifest.get("prNumber"), int) and manifest["prNumber"] > 0:
              print(manifest["prNumber"])
          else:
              m = re.search(r"-dev\.pr(\d+)\.", manifest.get("version", ""))
              if not m:
                  raise SystemExit("Manifest does not contain a PR number")
              print(m.group(1))
          PY
          )"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$pr_number" != "$DISPATCH_PR_NUMBER" ]]; then
            echo "Artifact PR number does not match the requested PR" >&2
            exit 1
          fi

          pr_json="$RUNNER_TEMP/pr.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "$pr_json"
          python3 - "$pr_json" "$GITHUB_REPOSITORY" "$run_head_sha" "$EVENT_NAME" <<'PY'
          import json, sys
          from pathlib import Path
          pr = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          repo, run_sha, event_name = sys.argv[2].lower(), sys.argv[3].lower(), sys.argv[4]
          head = pr.get("head") or {}
          head_repo = head.get("repo") or {}
          labels = {str(item.get("name", "")).lower() for item in pr.get("labels") or []}
          if pr.get("state") != "open":
              raise SystemExit("PR is no longer open; skipping publish")
          if str(head.get("sha", "")).lower() != run_sha:
              raise SystemExit("PR head SHA does not match the CI run SHA")
          if event_name == "workflow_dispatch":
              if not head_repo.get("fork") or "test-build" not in labels:
                  raise SystemExit("Dispatch requires an open fork PR with the test-build label")
          elif head_repo.get("full_name", "").lower() != repo:
              raise SystemExit("workflow_run publication is limited to same-repository PRs")
          PY

          zip_name="Decky-Metadata-pr-${pr_number}.zip"
          sha_name="Decky-Metadata-pr-${pr_number}.zip.sha256"
          manifest_name="Decky-Metadata-pr-${pr_number}.manifest.json"

          cp Decky-Metadata.zip "$zip_name"
          sha="$(sha256sum "$zip_name" | awk '{print $1}')"
          printf '%s  %s\n' "$sha" "$zip_name" > "$sha_name"
          python3 - Decky-Metadata.manifest.json "$manifest_name" "$pr_number" "$run_head_sha" "$zip_name" "$sha" <<'PY'
          import json, sys
          from pathlib import Path
          src, dst, pr_number, head_sha, asset_name, sha = sys.argv[1:7]
          manifest = json.loads(Path(src).read_text(encoding="utf-8"))
          if manifest.get("sha256", "").lower() != sha.lower():
              raise SystemExit("Manifest SHA-256 does not match ZIP digest")
          manifest["prNumber"] = int(pr_number)
          manifest["headSha"] = head_sha.lower()
          manifest["assetName"] = asset_name
          Path(dst).write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          sha256sum -c "$sha_name"

          notes="Automated pull request test builds for the Decky Metadata Settings -> Testing tab. Non-semver tag; ignored by stable and development update channels."
          if ! gh release view pr-builds >/dev/null 2>&1; then
            gh release create pr-builds "$zip_name" "$sha_name" "$manifest_name" \
              --prerelease \
              --target dev \
              --title "PR test builds" \
              --notes "$notes"
          else
            gh release upload pr-builds "$zip_name" "$sha_name" "$manifest_name" --clobber
          fi

          open_prs="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '[.[].number | tostring] | join(" ")')"
          for asset in $(gh release view pr-builds --json assets --jq '.assets[].name'); do
            if [[ "$asset" =~ ^Decky-Metadata-pr-([0-9]+)\.(zip|zip\.sha256|manifest\.json)$ ]]; then
              num="${BASH_REMATCH[1]}"
              if [[ ! " $open_prs " =~ " $num " ]]; then
                gh release delete-asset pr-builds "$asset" --yes || true
              fi
            fi
          done
