# Scheduled workflows run only from GitHub's default branch (main).
name: IGN Trailer Health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: ign-trailer-health
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check trailer discovery and MP4 delivery
    runs-on: ubuntu-latest
    steps:
      - name: Check out current default branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Probe IGN game trailers
        id: probe
        run: python3 scripts/check_ign_trailers.py

      - name: Raise or reuse open issue on failure
        if: ${{ failure() && steps.probe.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/report_ign_trailer_failure.sh
